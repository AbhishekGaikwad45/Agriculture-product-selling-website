<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  
    .contact-container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      margin-top: 80px;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }
  
    .contact-container:hover {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      transform: scale(1.01);
    }
  
    h2 {
      font-weight: 700;
      text-align: center;
      margin-bottom: 30px;
      color: #198754;
    }
  
    .form-labels h5 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 8px;
      transition: color 0.3s ease;
    }
  
    .form-labels h5:hover {
      color: #157347;
    }
  
    .form-control {
      border-radius: 8px;
      transition: all 0.3s ease;
      box-shadow: none;
    }
  
    .form-control:focus {
      border-color: #198754;
      box-shadow: 0 0 5px rgba(25, 135, 84, 0.5);
    }
  
    .form-control:hover {
      background-color: #f1fdf5;
    }
  
    #statusMessage {
      text-align: center;
      font-weight: 500;
      color: #0d6efd;
    }
  
    button.btn-success {
      width: 100%;
      padding: 12px;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      background-color: #198754;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }
  
    button.btn-success:hover {
      background-color: #157347;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(21, 115, 71, 0.2);
    }
  </style>
  
</head>
<body>

  <div class="container">
    <div class="contact-container">
      <form id="contactForm">
        <h2>Contact Us!</h2>

        <div class="mb-3">
          <label for="name" class="form-labels"><h5>Name:</h5></label>
          <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="mb-3">
          <label for="mobile" class="form-labels"><h5>Number:</h5></label>
          <input type="tel" class="form-control" id="mobile" name="mobile" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-labels"><h5>Email Address:</h5></label>
          <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="mb-3">
          <label for="message" class="form-labels"><h5>Message:</h5></label>
          <textarea class="form-control" id="message" name="message" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-success mb-3">Send Message</button>
      </form>
      <div id="statusMessage" class="mt-3"></div>
    </div>
  </div>

</body>
</html>
