<section class="signup">
  <div class="container mt-5">
  
  <form id="contactForm">
    <h2>Contact Us!</h2>
      <div class="mb-3">
          <label for="name" class="form-labels"><h5>Name:</h5></label>
          <input type="text" class="form-control" id="name" name="name" required>
      </div>
      <div class="mb-3">
          <label for="mobile" class="form-labels"><h5>Number:</h5></label>
          <input type="tel" class="form-control" id="mobile" name="mobile" required>
      </div>
      <div class="mb-3">
          <label for="email" class="form-labels"><h5>Email Address:</h5></label>
          <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
          <label for="message" class="form-labels"><h5>Message:</h5></label>
          <textarea class="form-control" id="message" name="message" rows="3" required></textarea>
      </div>
      <button type="submit" class="btn btn-success mb-3">Send Message</button>
  </form>
  <div id="statusMessage" class="mt-3 "></div>
</div>

<!-- Bootstrap 5 JS and EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

<script type="text/javascript">
  (function(){
      emailjs.init("KdK9GBxAZlkKn6jpw"); // Replace with your EmailJS user ID or public key
  })();

  document.getElementById('contactForm').addEventListener('submit', function(event) {
      event.preventDefault();

      let name = document.getElementById('name').value;
      let mobile = document.getElementById('mobile').value;
      let email = document.getElementById('email').value;
      let message = document.getElementById('message').value;

      console.log(name);
      console.log(mobile);
      console.log(email);
      console.log(message);
      
      


      let templateParams = {
          name: name,
          mobile: mobile,
          email: email,
          message: message
      };

      emailjs.send('service_4mvc2dk','template_hx14ylc', templateParams)
      .then(function(response) {
          document.getElementById('statusMessage').innerHTML = '<div class="alert alert-success">Message sent successfully!</div>';
      }, function(error) {
          document.getElementById('statusMessage').innerHTML = '<div class="alert alert-danger">Failed to send message. Please try again later.</div>';
      });
  });
</script>
